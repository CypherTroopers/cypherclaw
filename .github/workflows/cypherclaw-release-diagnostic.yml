name: CypherClaw Release Diagnostic
run-name: Diagnose sealed CypherClaw 10.6 upgrades

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cypherclaw-release-diagnostic-39915228885
  cancel-in-progress: false

jobs:
  upgrade-diagnostic:
    name: Diagnose sealed upgrade (${{ matrix.target }})
    if: github.repository == 'CypherTroopers/cypherclaw'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
            timeout: 120
          - runner: windows-2025
            target: win32-x64
            timeout: 180
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_CANDIDATE_SOURCE_SHA: 80d0f511b03a0f1f189f20c153461c219a092a09
      EXPECTED_REVIEWED_SOURCE_SHA: 85dbb2a057f2925a46a5095e2eb0f8348627a3f8
      EXPECTED_NATIVE_SOURCE_SHA: 546d43442e8156591786dc3c1ca1596f014509e3
      EXPECTED_NATIVE_DISTRIBUTION_SHA: 9ca4b9793d6e3527f4439ab4cc29a500a160c134
      EXPECTED_BASELINE_RELEASE_TAG: cypherclaw-v2026.10.5-3ecb54765fd9
      EXPECTED_BASELINE_SOURCE_SHA: 3ecb54765fd939ddfba55ccb2ce35df9371934d6
      EXPECTED_BASELINE_PACKAGE_SHA256: 319e9431b93d83331180b9a38c0b55884d20cddc5ebf17e3bd7c389f3afd4b69
      EXPECTED_BASELINE_MANIFEST_SHA256: d34f9801155554c79e0e3fd83568cfe12f5fcefc7173ec5fdb62426c6fb5f6d1
    steps:
      - name: Checkout this run's diagnostic tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pinned validation runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"

      - name: Verify original completed run and immutable artifact identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const repository = 'CypherTroopers/cypherclaw';
          const originalRun = 39915228885;
          const originalHead = process.env.EXPECTED_REVIEWED_SOURCE_SHA;
          const read = (endpoint) => JSON.parse(execFileSync('gh', [
            'api', '--method', 'GET', `repos/${repository}/actions/${endpoint}`,
          ], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }));
          const run = read(`runs/${originalRun}`);
          assert.equal(run.id, originalRun);
          assert.equal(run.repository.full_name, repository);
          assert.equal(run.head_repository.full_name, repository);
          assert.equal(run.workflow_id, 380635974);
          assert.equal(run.path, '.github/workflows/cypherclaw-release.yml');
          assert.equal(run.event, 'workflow_dispatch');
          assert.equal(run.head_branch, 'cypherclaw-stable');
          assert.equal(run.head_sha, originalHead);
          assert.equal(run.run_attempt, 1);
          assert.equal(run.status, 'completed');
          assert.equal(run.conclusion, 'failure');
          assert(Number.isFinite(Date.parse(run.created_at)));
          assert(Number.isFinite(Date.parse(run.run_started_at)));
          assert(Date.parse(run.updated_at) >= Date.parse(run.run_started_at));
          for (const expected of [
            { id: 12485527251, name: 'cypherclaw-release-80d0f511b03a0f1f189f20c153461c219a092a09', digest: 'sha256:3d42c06e26314cdd4cc9b5f3aa7ad46d618e83d2913acf7423a86ce427eb0e09', size: 267880298 },
            { id: 12484825859, name: 'cypherclaw-upgrade-baseline-39915228885', digest: 'sha256:1101a14a6acbc0bacf95947a6d2af415aa0fadc5763f2bdc64d046489d86b7c0', size: 267770507 },
          ]) {
            const artifact = read(`artifacts/${expected.id}`);
            assert.equal(artifact.id, expected.id);
            assert.equal(artifact.name, expected.name);
            assert.equal(artifact.digest, expected.digest);
            assert.equal(artifact.size_in_bytes, expected.size);
            assert.equal(artifact.expired, false);
            assert.equal(artifact.workflow_run.id, originalRun);
            assert.equal(artifact.workflow_run.repository_id, run.repository.id);
            assert.equal(artifact.workflow_run.head_repository_id, run.head_repository.id);
            assert.equal(artifact.workflow_run.head_branch, run.head_branch);
            assert.equal(artifact.workflow_run.head_sha, originalHead);
            assert(Date.parse(artifact.created_at) >= Date.parse(run.created_at));
            assert(Date.parse(artifact.created_at) <= Date.parse(run.updated_at));
          }
          console.log('Verified original attempt 1 and both exact sealed artifacts.');
          NODE

      - name: Download exact sealed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          repository: CypherTroopers/cypherclaw
          run-id: "39915228885"
          artifact-ids: "12485527251"
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/cypherclaw-candidate

      - name: Download exact published baseline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          repository: CypherTroopers/cypherclaw
          run-id: "39915228885"
          artifact-ids: "12484825859"
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/cypherclaw-baseline

      - name: Diagnose the existing running-Gateway upgrade fixture
        run: >-
          node scripts/test-cypherclaw-release.mts
          --candidate-dir "$RUNNER_TEMP/cypherclaw-candidate"
          --baseline-dir "$RUNNER_TEMP/cypherclaw-baseline"
          --output-dir "$RUNNER_TEMP/cypherclaw-upgrade-proof"
          --target "${{ matrix.target }}"

      - name: Encrypt failed fixture command details for the task operator
        if: failure()
        env:
          DIAGNOSTIC_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEApj5d3jaQX4j/rlocqUUQ
            MtR3U1j/8Lb0VCRz5uLzp9ACF9GKCums/txeyIhx6vm5p36NV39uwuaIAcIK4hr+
            +MrfnK0dQ4l5yNymk/OtrMeiW1q5t8K3YiixVrnILR1KyO6knIdin3Tnu88vgmHe
            BBbtB0MUtq1mnkjf6mykqDdfzaX98B0EIfECoZ8wZXBqyXJqOx3LoojTUWhgkn1h
            KjiUKFR5lKqkPFkN7K/Nmir8ZChLG/AvCS+1jr9KoXk7I6cSCgjZJQFThY5/EfTv
            44xEVYKVUgPyCkQDLf7Lg8kx619EHKAvt5WQdYQGlbUeRgb/iQIccQV74PrwaDcA
            PCeRTZYrglB6g7ek93hPaHBhLdW5OBRWyshBUuDM0/ZUhfmA72iErHlt1iaBwnZb
            feK8BZzGyjrCA3vWqY2oF2edNGB39Kpu3Ijsmz7B850kbNVldcsHAaQsBoPIaeL+
            UhHl0iJDqGx0PIH5Q/kp6CNgLQKm/vgYsJwNIlLTzB4vAgMBAAE=
            -----END PUBLIC KEY-----
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { constants, createCipheriv, publicEncrypt, randomBytes } from 'node:crypto';
          const root = path.join(process.env.RUNNER_TEMP, 'cypherclaw-upgrade-proof');
          const receipt = JSON.parse(fs.readFileSync(path.join(root, 'receipt.json'), 'utf8'));
          assert.equal(receipt.status, 'failed');
          const names = fs.readdirSync(root);
          const files = {};
          for (const kind of ['installer', 'command']) {
            const selected = names.filter(name => new RegExp(`^[1-9][0-9]*-${kind}\\.log$`).test(name))
              .sort((a, b) => Number.parseInt(a, 10) - Number.parseInt(b, 10)).at(-1);
            if (!selected) continue;
            const file = path.join(root, selected);
            const stat = fs.lstatSync(file);
            assert(stat.isFile() && !stat.isSymbolicLink() && stat.size <= 8 * 1024 * 1024);
            files[kind] = fs.readFileSync(file, 'utf8');
          }
          assert(Object.keys(files).length > 0);
          const key = randomBytes(32);
          const iv = randomBytes(12);
          const cipher = createCipheriv('aes-256-gcm', key, iv);
          const ciphertext = Buffer.concat([cipher.update(JSON.stringify({ target: receipt.target, phase: receipt.phase, files })), cipher.final()]);
          const wrappedKey = publicEncrypt({ key: process.env.DIAGNOSTIC_PUBLIC_KEY, oaepHash: 'sha256', padding: constants.RSA_PKCS1_OAEP_PADDING }, key);
          fs.writeFileSync(path.join(root, 'encrypted-diagnostic.json'), JSON.stringify({
            schemaVersion: 1, algorithm: 'RSA-OAEP-SHA256/AES-256-GCM',
            key: wrappedKey.toString('base64'), iv: iv.toString('base64'),
            tag: cipher.getAuthTag().toString('base64'), ciphertext: ciphertext.toString('base64'),
          }), { mode: 0o600, flag: 'wx' });
          console.log('Encrypted only the final installer and status logs; plaintext remains on the disposable runner.');
          NODE

      - name: Upload sanitized receipt and encrypted task details
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cypherclaw-release-diagnostic-${{ matrix.target }}-39915228885-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cypherclaw-upgrade-proof/receipt.json
            ${{ runner.temp }}/cypherclaw-upgrade-proof/encrypted-diagnostic.json
          if-no-files-found: error
          retention-days: 7
