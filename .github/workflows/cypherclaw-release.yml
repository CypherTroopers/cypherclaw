name: CypherClaw Release
run-name: CypherClaw latest FHS-D ${{ inputs.publish && 'publish' || 'prepare' }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional reviewed stable SHA; blank selects this run's cypherclaw-stable commit
        required: false
        type: string
      publish:
        description: Publish the prepared release only if its manifest has no publication blockers
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cypherclaw-stable-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'CypherTroopers/cypherclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      native_distribution_sha: ${{ steps.native-source.outputs.sha }}
    steps:
      - name: Validate source identity
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          SOURCE_SHA="${REQUESTED_SHA:-$WORKFLOW_SHA}"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full lowercase source SHA is required.' >&2; exit 1; }
          printf 'sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout reviewed source metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: cypher/patches

      - name: Verify stable membership and resolve latest FHS-D once
        id: native-source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git merge-base --is-ancestor "$SOURCE_SHA" origin/cypherclaw-stable
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          root = pathlib.Path('cypher/patches')
          metadata = json.loads((root / 'transaction-finality-source.json').read_text())
          sha = metadata['baseCommit']
          if not re.fullmatch('[0-9a-f]{40}', sha):
              raise SystemExit('A pinned native source SHA is required')
          if metadata['patch'] != 'transaction-finality-ipc.patch' or hashlib.sha256((root / metadata['patch']).read_bytes()).hexdigest() != metadata['patchSha256']:
              raise SystemExit('Native source patch identity mismatch')
          PY
          NATIVE_SHA="$(git ls-remote https://github.com/CypherTroopers/cypher.git refs/heads/FHS-D | awk '$2 == "refs/heads/FHS-D" {print $1}')"
          [[ "$NATIVE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Cannot resolve the latest FHS-D commit.' >&2; exit 1; }
          printf 'sha=%s\n' "$NATIVE_SHA" >> "$GITHUB_OUTPUT"
          printf 'Selected CypherClaw `%s` and current FHS-D `%s`. All targets use these exact commits.\n' "$SOURCE_SHA" "$NATIVE_SHA" >> "$GITHUB_STEP_SUMMARY"

  acquire-native:
    name: Acquire official FHS-D node outputs
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      native_source_sha: ${{ steps.native.outputs.source_sha }}
      native_distribution_sha: ${{ steps.native.outputs.distribution_sha }}
    steps:
      - name: Checkout reviewed CypherClaw intake tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
          sparse-checkout: scripts

      - name: Checkout exact FHS-D distribution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CypherTroopers/cypher
          ref: ${{ needs.validate.outputs.native_distribution_sha }}
          fetch-depth: 0
          path: .artifacts/cypher-source
          persist-credentials: false

      - name: Import unchanged official node files
        id: native
        env:
          DISTRIBUTION_SHA: ${{ needs.validate.outputs.native_distribution_sha }}
        run: |
          node scripts/import-cypherclaw-native.mjs --source-dir .artifacts/cypher-source --distribution-sha "$DISTRIBUTION_SHA" --output-dir "$RUNNER_TEMP/cypherclaw-official" > "$RUNNER_TEMP/cypherclaw-official.json"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const identity = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/cypherclaw-official.json`, 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_sha=${identity.nativeSourceCommit}\ndistribution_sha=${identity.nativeDistributionCommit}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Official FHS-D build source: ${identity.nativeSourceCommit}\n\nDistribution commit: ${identity.nativeDistributionCommit}\n`);
          NODE

      - name: Export matching repository source
        env:
          SOURCE_SHA: ${{ steps.native.outputs.source_sha }}
        run: |
          git -C .artifacts/cypher-source checkout --detach "$SOURCE_SHA"
          python3 scripts/export-cypherclaw-native-source.py --source-dir .artifacts/cypher-source --source-sha "$SOURCE_SHA" --output-dir "$RUNNER_TEMP/cypherclaw-native-source"

      - name: Upload admitted node outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cypherclaw-native-${{ needs.validate.outputs.native_distribution_sha }}
          path: ${{ runner.temp }}/cypherclaw-official/native
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload matching source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cypherclaw-source-${{ needs.validate.outputs.native_distribution_sha }}
          path: ${{ runner.temp }}/cypherclaw-native-source/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  prepare:
    needs: [validate, acquire-native]
    if: github.repository == 'CypherTroopers/cypherclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      source_sha: ${{ steps.snapshot.outputs.sha }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      publication_ready: ${{ steps.identity.outputs.publication_ready }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create immutable release source snapshot
        id: snapshot
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          NATIVE_SOURCE_SHA: ${{ needs.acquire-native.outputs.native_source_sha }}
          NATIVE_DISTRIBUTION_SHA: ${{ needs.acquire-native.outputs.native_distribution_sha }}
        run: |
          node scripts/prepare-cypherclaw-release-source.mjs --source-sha "$SOURCE_SHA" --native-source-sha "$NATIVE_SOURCE_SHA" --native-distribution-sha "$NATIVE_DISTRIBUTION_SHA" --output-dir "$RUNNER_TEMP/cypherclaw-release-source" > "$RUNNER_TEMP/cypherclaw-release-source.json"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const identity = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/cypherclaw-release-source.json`, 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${identity.sourceCommit}\n`);
          NODE

      - name: Setup pinned package toolchain
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          install-bun: "true"
          frozen-lockfile: "true"

      - name: Download official node outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cypherclaw-native-${{ needs.acquire-native.outputs.native_distribution_sha }}
          path: ${{ runner.temp }}/cypherclaw-native

      - name: Download matching source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cypherclaw-source-${{ needs.acquire-native.outputs.native_distribution_sha }}
          path: ${{ runner.temp }}/cypherclaw-native-source

      - name: Build and seal release assets
        env:
          SOURCE_SHA: ${{ steps.snapshot.outputs.sha }}
          NATIVE_SOURCE_SHA: ${{ needs.acquire-native.outputs.native_source_sha }}
          NATIVE_DISTRIBUTION_SHA: ${{ needs.acquire-native.outputs.native_distribution_sha }}
        run: node scripts/build-cypherclaw-release.mjs --source-sha "$SOURCE_SHA" --native-artifacts-dir "$RUNNER_TEMP/cypherclaw-native" --native-source-sha "$NATIVE_SOURCE_SHA" --native-distribution-sha "$NATIVE_DISTRIBUTION_SHA" --native-source-bundle-dir "$RUNNER_TEMP/cypherclaw-native-source" --output-dir .artifacts/cypherclaw-release

      - name: Record release identity
        id: identity
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('.artifacts/cypherclaw-release/cypherclaw-release.json', 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_tag=${manifest.releaseTag}\npublication_ready=${manifest.publication.ready}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Prepared ${manifest.releaseTag}.\n\nReviewed CypherClaw: ${manifest.reviewedSourceCommit}\n\nFHS-D build source: ${manifest.nativeSourceCommit}\n\nFHS-D distribution: ${manifest.nativeDistributionCommit}\n\nRelease snapshot: ${manifest.sourceCommit}\n\n${manifest.publication.limitations.map((entry) => `- ${entry}`).join('\n')}\n`);
          NODE

      - name: Upload prepared release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cypherclaw-release-${{ steps.snapshot.outputs.sha }}
          path: .artifacts/cypherclaw-release/*
          if-no-files-found: error
          compression-level: 0

      - name: Upload release source objects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cypherclaw-release-source-${{ steps.snapshot.outputs.sha }}
          path: ${{ runner.temp }}/cypherclaw-release-source/cypherclaw-source.bundle
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [validate, acquire-native, prepare]
    if: github.repository == 'CypherTroopers/cypherclaw' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout reviewed source for tag verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Download release source objects
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cypherclaw-release-source-${{ needs.prepare.outputs.source_sha }}
          path: ${{ runner.temp }}/cypherclaw-release-source

      - name: Import and verify exact source snapshot
        working-directory: source
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          REVIEWED_SHA: ${{ needs.validate.outputs.source_sha }}
          NATIVE_SHA: ${{ needs.acquire-native.outputs.native_source_sha }}
          NATIVE_DISTRIBUTION_SHA: ${{ needs.acquire-native.outputs.native_distribution_sha }}
        run: |
          git bundle verify "$RUNNER_TEMP/cypherclaw-release-source/cypherclaw-source.bundle"
          git fetch --no-tags "$RUNNER_TEMP/cypherclaw-release-source/cypherclaw-source.bundle" refs/heads/cypherclaw-release-snapshot:refs/heads/cypherclaw-release-snapshot
          git checkout --detach "$SOURCE_SHA"
          node scripts/prepare-cypherclaw-release-source.mjs --verify --source-sha "$SOURCE_SHA" > "$RUNNER_TEMP/cypherclaw-publish-source.json"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const identity = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/cypherclaw-publish-source.json`, 'utf8'));
          if (identity.reviewedSourceCommit !== process.env.REVIEWED_SHA || identity.nativeSourceCommit !== process.env.NATIVE_SHA || identity.nativeDistributionCommit !== process.env.NATIVE_DISTRIBUTION_SHA) throw new Error('Release source selection changed.');
          NODE
      - name: Reject publication blockers
        env:
          PUBLICATION_READY: ${{ needs.prepare.outputs.publication_ready }}
        run: |
          if [[ "$PUBLICATION_READY" != true ]]; then
            echo 'The prepared manifest records unresolved publication blockers. The preparation artifact remains available; publication was refused.' >&2
            exit 1
          fi

      - name: Download exact prepared assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cypherclaw-release-${{ needs.prepare.outputs.source_sha }}
          path: release

      - name: Verify sealed bytes
        working-directory: release
        run: sha256sum --check SHA256SUMS

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          REVIEWED_SHA: ${{ needs.validate.outputs.source_sha }}
          NATIVE_SHA: ${{ needs.acquire-native.outputs.native_source_sha }}
          NATIVE_DISTRIBUTION_SHA: ${{ needs.acquire-native.outputs.native_distribution_sha }}
        run: |
          set -euo pipefail
          tag_commit() {
            local refs direct peeled
            refs="$(git ls-remote --tags https://github.com/CypherTroopers/cypherclaw.git \
              "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
            direct="$(awk -v ref="refs/tags/$RELEASE_TAG" '$2 == ref { print $1 }' <<< "$refs")"
            peeled="$(awk -v ref="refs/tags/$RELEASE_TAG^{}" '$2 == ref { print $1 }' <<< "$refs")"
            printf '%s' "${peeled:-$direct}"
          }
          selected_tag_commit="$(tag_commit)"
          if [[ -n "$selected_tag_commit" && "$selected_tag_commit" != "$SOURCE_SHA" ]]; then
            echo "The existing release tag points to $selected_tag_commit instead of the selected $SOURCE_SHA. Publication was refused." >&2
            exit 1
          fi
          if [[ -z "$selected_tag_commit" ]]; then
            gh auth setup-git
            git -C source push --no-follow-tags origin "$SOURCE_SHA:refs/tags/$RELEASE_TAG"
          fi
          [[ "$(tag_commit)" == "$SOURCE_SHA" ]] || { echo 'Cannot verify the selected tag before publication.' >&2; exit 1; }
          release_state="$(gh release list --repo CypherTroopers/cypherclaw --limit 1000 --json tagName,isDraft \
            | jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tagName == $tag) | if .isDraft then "draft" else "published" end')"
          if [[ -z "$release_state" ]]; then
            gh release create "$RELEASE_TAG" release/* \
              --repo CypherTroopers/cypherclaw --verify-tag --draft \
              --title "CypherClaw $RELEASE_TAG" \
              --notes "Reviewed cypherclaw-stable commit $REVIEWED_SHA; FHS-D build source $NATIVE_SHA; FHS-D distribution $NATIVE_DISTRIBUTION_SHA; immutable release snapshot $SOURCE_SHA. SHA256SUMS binds the installer, runtime, manifest, and package assets."
            release_state=draft
          fi
          verification_dir="$(mktemp -d "$RUNNER_TEMP/cypherclaw-release-verify.XXXXXXXX")"
          trap 'rm -rf -- "$verification_dir"' EXIT
          gh release download "$RELEASE_TAG" --repo CypherTroopers/cypherclaw --dir "$verification_dir"
          if ! diff <(find release -maxdepth 1 -type f -printf '%f\n' | sort) \
            <(find "$verification_dir" -maxdepth 1 -type f -printf '%f\n' | sort) \
            || ! cmp release/SHA256SUMS "$verification_dir/SHA256SUMS" \
            || ! (cd "$verification_dir" && sha256sum --check SHA256SUMS); then
            echo 'The retained release does not match these complete sealed assets. Preserve it for inspection; use a new reviewed commit rather than replacing assets.' >&2
            exit 1
          fi
          [[ "$(tag_commit)" == "$SOURCE_SHA" ]] || { echo 'The draft tag changed; preserve the draft for investigation.' >&2; exit 1; }
          if [[ "$release_state" == draft ]]; then
            gh release edit "$RELEASE_TAG" --repo CypherTroopers/cypherclaw --draft=false --latest
          else
            echo 'The identical immutable release is already published; no assets or latest pointer were changed.'
          fi
          [[ "$(tag_commit)" == "$SOURCE_SHA" ]] || { echo 'The published release tag changed; preserve the release for investigation.' >&2; exit 1; }
